name: TLC model check

on:
  push:
    branches:
      - main
    paths:
      - 'docs/rfc/specs/**'
      - 'pkg/statestore/**'
      - 'pkg/workflow/**'
      - 'hack/run-tlc.sh'
      - '.github/workflows/tlc.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/rfc/specs/**'
      - 'pkg/statestore/**'
      - 'pkg/workflow/**'
      - 'hack/run-tlc.sh'
      - '.github/workflows/tlc.yaml'

permissions:
  contents: read

env:
  TLA2TOOLS_VERSION: "1.8.0"

jobs:
  tlc:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Model-check the RFC protocol specs (queue + workflow fold)
        run: ./hack/run-tlc.sh
