name: Lint dashboards

on:
  push:
    branches:
      - main
    paths:
      - 'charts/fission-all/dashboards/**.json'
  pull_request:
    branches:
      - main
    paths:
      - 'charts/fission-all/dashboards/**.json'

permissions:
  contents: read

jobs:
  lint-dashboards:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"

      - name: Run dashboard linter
        run: ./hack/lint-dashboards.sh
