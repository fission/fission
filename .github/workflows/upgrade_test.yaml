name: Fission CI upgrade

# RFC-0028 phase 1: upgrade-under-load. Installs the latest published release,
# seeds fixtures, drives constant-rate load against the router via NodePort
# (port-forward would reconnect during the roll and pollute the transport-
# failure signal), runs `helm upgrade` to HEAD mid-load, and classifies every
# request outcome (ok / transport failure / platform-attributed / unattributed
# error) plus warm-pod UID survival and async queue durability.
#
# The error-budget evaluation step is NON-GATING (continue-on-error) while the
# rollout-posture work (RFC-0028 phases 2-3) drives the numbers to zero; the
# scenario itself fails the job only on infrastructure errors (fixtures,
# upgrade command, rollout timeout).

on:
  push:
    branches:
      - main
      - '!dependabot/**'
    paths:
      - "**.go"
      - "charts/**"
      - "test/**"
      - go.mod
      - go.sum
  pull_request:
    branches:
      - main
    paths:
      - "**.go"
      - "charts/**"
      - "test/**"
      - go.mod
      - go.sum

env:
  HELM_VERSION: v4.2.2
  KIND_VERSION: v0.32.0
  KIND_CLUSTER_NAME: kind
  FISSION_NAMESPACE: fission
  # Images built from HEAD are tagged with a tag that never exists upstream,
  # so pullPolicy=IfNotPresent can only resolve them from the kind image
  # store — never by silently pulling a stale published image from GHCR.
  HEAD_TAG: upgrade-test
  # Must match the chart's routerPort default (charts/fission-all/values.yaml),
  # which becomes the Service nodePort under routerServiceType=NodePort.
  ROUTER_NODEPORT: 31314
  HELM_VARS_HEAD: routerServiceType=NodePort,repository=ghcr.io,image=fission/fission-bundle,pullPolicy=IfNotPresent,imageTag=upgrade-test,fetcher.image=fission/fetcher,fetcher.imageTag=upgrade-test,postInstallReportImage=fission/reporter,preUpgradeChecks.image=fission/pre-upgrade-checks,preUpgradeChecks.imageTag=upgrade-test,analytics=false

permissions:
  contents: read

concurrency:
  group: fission-upgrade-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade-test:
    runs-on: ${{ matrix.os }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    strategy:
      fail-fast: false
      matrix:
        kindversion: ["v1.32.11"]
        os: [ubuntu-24.04]
        # RFC-0028 phase 5. "latest" is the N-1 -> N path RELEASES.md supports;
        # "skip-level" is N-2 -> N, which the support window does NOT promise but
        # real clusters attempt constantly, because upgrading is deferred until
        # something forces it. Testing it is how we learn whether it works
        # rather than finding out from an issue.
        upgradeFrom: [latest, skip-level]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout action sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Setup Helm
        uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Setup Kind Cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          node_image: kindest/node:${{ matrix.kindversion }}
          version: ${{ env.KIND_VERSION }}
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
          version: "~> v2"

      - name: Setup kubectl
        run: |
          kubectl cluster-info --context kind-${{ env.KIND_CLUSTER_NAME }}
          kubectl config use-context kind-${{ env.KIND_CLUSTER_NAME }}
          kubectl config set-context --current --namespace=default
          kubectl get nodes

      - name: Install latest published fission release
        run: |
          helm repo add fission-charts https://fission.github.io/fission-charts/
          helm repo update
          # appVersion already carries the v prefix (hack/generate-helm-manifest.sh
          # stamps the git tag verbatim), e.g. "appVersion: v1.27.0".
          LATEST_TAG=$(helm show chart fission-charts/fission-all | awk '/^appVersion:/{print $2}')

          # Distinct appVersions, newest first. A chart may publish several
          # revisions per appVersion, so dedupe before counting back.
          mapfile -t VERSIONS < <(helm search repo fission-charts/fission-all --versions -o json \
            | python3 -c 'import sys,json;seen=[];[seen.append(r["app_version"]) for r in json.load(sys.stdin) if r.get("app_version") and r["app_version"] not in seen];print("\n".join(seen))')

          case "${{ matrix.upgradeFrom }}" in
            latest)
              FROM_TAG="$LATEST_TAG"
              ;;
            skip-level)
              # N-2. Outside the supported window on purpose: this leg exists to
              # find out whether the skip works, not to assert a promise.
              if [ "${#VERSIONS[@]}" -lt 3 ]; then
                echo "fewer than three published appVersions (${VERSIONS[*]}); nothing to skip from"
                echo "SKIP_LEG=1" >> "$GITHUB_ENV"
                exit 0
              fi
              FROM_TAG="${VERSIONS[2]}"
              ;;
          esac

          CHART_VER=$(helm search repo fission-charts/fission-all --versions -o json \
            | python3 -c "import sys,json;print(next(r['version'] for r in json.load(sys.stdin) if r['app_version']=='$FROM_TAG'))")

          echo "Installing $FROM_TAG (chart $CHART_VER) as the upgrade source [${{ matrix.upgradeFrom }}]"
          echo "LATEST_TAG=$FROM_TAG" >> "$GITHUB_ENV"
          kubectl create ns ${{ env.FISSION_NAMESPACE }}
          kubectl create -k "github.com/fission/fission/crds/v1?ref=$FROM_TAG"
          helm install --wait --timeout 10m --namespace ${{ env.FISSION_NAMESPACE }} fission \
            fission-charts/fission-all --version "$CHART_VER" --set routerServiceType=NodePort,analytics=false

      # Record which Secrets the HEAD chart will ask the pre-upgrade hook to
      # adopt AND that the PUBLISHED release actually created. Both filters
      # matter: the adopt list is values-dependent (the `router` Secret is only
      # adopted when authentication is enabled, which it is not here), and a
      # Secret that is new in HEAD does not exist when the hook runs, so it is
      # legitimately un-annotated afterwards. Deriving the list from the chart
      # rather than hardcoding it keeps this from drifting out of sync.
      - name: Record pre-upgrade secret inventory
        if: ${{ env.SKIP_LEG != '1' }}
        run: |
          set -euo pipefail
          adopt=$(helm template fission "$GITHUB_WORKSPACE/charts/fission-all" \
            --namespace ${{ env.FISSION_NAMESPACE }} --set ${{ env.HELM_VARS_HEAD }} \
            | awk '/name: ADOPT_SECRETS$/{getline; sub(/^[[:space:]]*value:[[:space:]]*/,""); gsub(/"/,""); print; exit}')
          echo "HEAD chart adopt list: '${adopt}'"
          if [ -z "$adopt" ]; then
            echo "chart rendered no ADOPT_SECRETS; the migration hook would be a no-op"
            exit 1
          fi
          : > "$GITHUB_WORKSPACE/pre-upgrade-secrets.txt"
          for secret in $adopt; do
            if kubectl get secret "$secret" -n ${{ env.FISSION_NAMESPACE }} >/dev/null 2>&1; then
              echo "$secret" >> "$GITHUB_WORKSPACE/pre-upgrade-secrets.txt"
            else
              echo "note: $secret is new in HEAD (absent in ${{ env.LATEST_TAG }}); not asserted"
            fi
          done
          echo "adoption candidates present before upgrade:"
          cat "$GITHUB_WORKSPACE/pre-upgrade-secrets.txt"

      - name: Build HEAD images and load into kind
        if: ${{ env.SKIP_LEG != '1' }}
        run: |
          make skaffold-prebuild
          # builder images come from Environment CRDs and the reporter is
          # disabled by analytics=false, so only the images the upgraded chart
          # actually schedules are built.
          for img in fission-bundle fetcher pre-upgrade-checks; do
            docker buildx build -t "ghcr.io/fission/${img}:${{ env.HEAD_TAG }}" \
              "dist/${img}_linux_amd64_v1" --platform linux/amd64
            kind load docker-image "ghcr.io/fission/${img}:${{ env.HEAD_TAG }}" --name ${{ env.KIND_CLUSTER_NAME }}
          done
          helm dependency update charts/fission-all

      - name: Run upgrade-under-load
        if: ${{ env.SKIP_LEG != '1' }}
        timeout-minutes: 30
        env:
          NODE_RUNTIME_IMAGE: ghcr.io/fission/node-env
        run: |
          NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')
          echo "Router via NodePort: http://$NODE_IP:${{ env.ROUTER_NODEPORT }}"
          # Server-side apply, not replace/client-side apply: HEAD introduces CRDs
          # absent on the N-1 release (replace cannot create), four CRD YAMLs
          # exceed the 262KB client-side-apply annotation limit, and the
          # kubectl-create-owned managedFields of the originals require
          # --force-conflicts on first SSA adoption (the RFC-0029 §1 flow).
          UPGRADE_CMD="kubectl apply --server-side --force-conflicts -k $GITHUB_WORKSPACE/crds/v1 && helm upgrade --namespace ${{ env.FISSION_NAMESPACE }} --set ${{ env.HELM_VARS_HEAD }} fission $GITHUB_WORKSPACE/charts/fission-all"
          cd test/benchmark
          go build -o fission-benchmark ./cmd/fission-benchmark
          ./fission-benchmark run \
            --scenarios upgrade-under-load \
            --upgrade-cmd "$UPGRADE_CMD" \
            --router-url "http://$NODE_IP:${{ env.ROUTER_NODEPORT }}" \
            --namespace default --fission-namespace ${{ env.FISSION_NAMESPACE }} \
            --fission-version "${{ env.LATEST_TAG }}->HEAD (${{ matrix.upgradeFrom }})" \
            --git-sha "${{ github.sha }}" \
            --out "$GITHUB_WORKSPACE/upgrade-results.json"
          # The benchmark CLI's failure budget records scenario errors in the
          # results instead of failing the process; an infra error or a skip
          # here means the leg measured nothing and must fail loudly.
          problem=$(jq -r '.scenarios[] | select(.error or .skipped) | .error // .skipReason' "$GITHUB_WORKSPACE/upgrade-results.json")
          if [ -n "$problem" ]; then
            echo "upgrade-under-load did not complete: $problem"
            exit 1
          fi

      # The pre-upgrade hook stamps helm.sh/resource-policy=keep onto the
      # chart-generated Secrets so a later release can stop rendering them
      # without Helm pruning the live objects. Nothing else in this workflow
      # would notice if the hook silently did nothing: the Secrets are still
      # rendered today, so a missing annotation costs nothing until the
      # release that removes them — at which point the internal-auth master
      # is pruned and every control-plane pod wedges in
      # CreateContainerConfigError. Assert it here, on a real upgrade from
      # the last published release, which is the only place the hook runs.
      - name: Verify the pre-upgrade hook adopted the generated Secrets
        if: ${{ env.SKIP_LEG != '1' }}
        run: |
          set -euo pipefail
          if [ ! -s "$GITHUB_WORKSPACE/pre-upgrade-secrets.txt" ]; then
            echo "no adoption candidates existed before the upgrade; nothing was exercised"
            exit 1
          fi
          rc=0
          while read -r secret; do
            got=$(kubectl get secret "$secret" -n ${{ env.FISSION_NAMESPACE }} \
              -o jsonpath='{.metadata.annotations.helm\.sh/resource-policy}' 2>/dev/null || true)
            if [ "$got" = "keep" ]; then
              echo "ok: $secret is annotated for retention"
            else
              echo "FAIL: $secret has resource-policy='${got:-<unset>}', expected 'keep'"
              rc=1
            fi
          done < "$GITHUB_WORKSPACE/pre-upgrade-secrets.txt"
          exit $rc

      - name: Evaluate error budget (non-gating)
        if: ${{ env.SKIP_LEG != '1' }}
        continue-on-error: true
        run: |
          jq '.scenarios[] | select(.name=="upgrade-under-load")' upgrade-results.json | tee upgrade-summary.json
          # Published error budget, phase 1: zero platform-attributed failures,
          # zero transport-level failures, zero unattributed errors, warm pods
          # survive. Non-gating until RFC-0028 phases 2-3 land the rollout
          # posture that makes it reliably true; flip by removing
          # continue-on-error above.
          fail=0
          for metric in poolmgr_transport_failures poolmgr_platform_attributed poolmgr_unattributed_errors \
                        newdeploy_transport_failures newdeploy_platform_attributed newdeploy_unattributed_errors; do
            v=$(jq -r --arg m "$metric" '.metrics[] | select(.name==$m) | .value' upgrade-summary.json)
            echo "$metric = $v"
            [ "${v%.*}" != "0" ] && fail=1
          done
          survival=$(jq -r '.metrics[] | select(.name=="warm_pod_survival") | .value' upgrade-summary.json)
          echo "warm_pod_survival = $survival"
          [ "${survival%.*}" != "1" ] && fail=1
          exit $fail

      - name: Upload upgrade results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-results-${{ github.run_id }}-${{ matrix.kindversion }}-${{ matrix.upgradeFrom }}
          path: upgrade-results.json
          retention-days: 14
          # A skipped leg (SKIP_LEG=1: fewer than three published appVersions,
          # so there is no N-2 to skip-level from) never writes the file, and
          # this step still runs under always(). Default `warn` would print a
          # red herring on every such run; the leg is meant to skip cleanly.
          if-no-files-found: ignore

      - name: Kind export logs
        if: ${{ always() }}
        run: |
          kind export logs --name ${{ env.KIND_CLUSTER_NAME }} kind-logs

      - name: Archive kind logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-logs-${{ github.run_id }}-${{ matrix.kindversion }}-${{ matrix.upgradeFrom }}
          path: kind-logs/*
          retention-days: 5
