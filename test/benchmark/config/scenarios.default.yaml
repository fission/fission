# Default scenario parameters for `fission-benchmark run --config`.
# Durations are Go duration strings. Omit a field to take the built-in default.
# For a quick smoke run, keep this file but pass: --tags smoke --duration 15s --warmup 5s
poolsize: 3
coldIterations: 20
# Re-run every scenario N times (fresh resources each rep) and report per-metric
# medians with a min..max range in the result meta. Raise for A/B dispatches
# where a single sample can't clear the cluster noise floor.
repetitions: 1
# Simultaneous first-requests for the cold-burst scenarios; > poolsize so the
# burst forces pool exhaustion + refill instead of being absorbed by warm pods.
burstSize: 10
# Function A's provisioned target during the P5 starvation-guardrail
# scenario's treatment phase; sized to trigger a real eager warm-up burst.
provisionedWarmTarget: 20
# Pool size for that scenario's shared environment; bigger than the burst so
# pool exhaustion isn't what's being measured.
provisionedWarmPoolsize: 30
# Cold-start samples per phase (baseline, then treatment) for function B.
provisionedWarmIterations: 10
warmDuration: 60s
warmWarmup: 10s
warmConcurrency: 50
concurrencyLevels: [10, 50, 100, 250, 500]
rpsLevels: [100, 250, 500, 1000]
payloadSizes: [1024, 10240, 102400, 1048576]
executors: [poolmgr, newdeploy]
# Secret/ConfigMap references for the cold-start-poolmgr-configdeps scenario,
# which measures the per-reference specialization-time existence checks.
configDepsSecrets: 5
configDepsConfigmaps: 5
# Function's provisioned target (floor) during the idle-warm scenario.
provisionedIdleFloor: 3
# Pool size for that scenario's shared environment; bigger than floor +
# overflow burst so pool exhaustion isn't what's being measured.
provisionedIdlePoolsize: 10
# How long to let the floor sit idle before each post-idle burst.
provisionedIdleDuration: 10m
# Simultaneous requests for the within-floor burst; must stay <= floor so
# it's fully absorbed by warm provisioned pods.
provisionedIdleWithinBurst: 3
# Simultaneous requests for the overflow burst; > floor so the excess pays
# a real cold start.
provisionedIdleOverflowBurst: 5
