apiVersion: v1
kind: ServiceAccount
metadata:
  name: fission-preupgrade
  namespace: {{ .Release.Namespace }}
  annotations:
    # pre-install: see the fission.crdsMode helper in _helpers.tpl.
    helm.sh/hook: pre-install,pre-upgrade
    # hook-succeeded as well as before-hook-creation, so the CRD-write
    # privilege does not outlive the hook that needs it.
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
    # Strictly below the Job's weight, or Helm may order the Job before the
    # identity it runs as.
    helm.sh/hook-weight: "-3"
    {{- with include "fission.saAnnotations" (dict "root" . "component" "preupgrade") }}{{ . | nindent 4 }}{{- end }}
  {{- include "fission.saLabelsBlock" (dict "root" . "component" "preupgrade") }}
