apiVersion: v1
kind: ServiceAccount
metadata:
  name: fission-preupgrade
  namespace: {{ .Release.Namespace }}
  annotations:
    # pre-install too: crds.mode=hook must deliver CRDs on a FRESH cluster,
    # which is the whole point of a one-shot `helm install`.
    helm.sh/hook: pre-install,pre-upgrade
    # hook-succeeded as well as before-hook-creation, so the CRD-write
    # privilege does not outlive the hook that needs it.
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
    # Strictly below the Job's weight, or Helm may order the Job before the
    # identity it runs as.
    helm.sh/hook-weight: "-3"
