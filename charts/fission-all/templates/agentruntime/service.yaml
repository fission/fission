{{- if .Values.agentRuntime.enabled }}
# agentruntime is a ClusterIP-only Service: the agent runtime dispatcher is
# reached only by in-cluster callers (front it with an Ingress / Gateway /
# port-forward if external access is needed). It never joins the public
# router listener. If you front GET /registry/events (the SSE registry
# feed) externally, configure your Ingress/Gateway to redact or suppress
# the `token` query parameter in access logs — it carries the caller's
# full-privilege dispatch JWT (see pkg/agentruntime/events.go's
# EventsHandler doc comment).
apiVersion: v1
kind: Service
metadata:
  name: agentruntime
  labels:
    svc: agentruntime
    application: fission-agentruntime
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
spec:
  type: ClusterIP
  ports:
  - name: agentruntime
    port: {{ include "fission.agentRuntimePort" . }}
    targetPort: {{ include "fission.agentRuntimePort" . }}
  selector:
    svc: agentruntime
{{- end }}
