{{- if include "fission.internalAuthGenerated" . }}
{{- /*
Generating the HMAC master in a pre-install hook Job rather than in a template
is the whole point (RFC-0029 §3).

A template can only preserve a generated value through `lookup`, and `lookup`
returns empty under `helm template` — which is how Argo CD and Flux render. So
a templated master is re-minted on every GitOps sync, rotating every derived
key (per-service, per-namespace tenancy, per-keyspace tokens) underneath
running pods with no dual-accept window, across fail-closed channels. The
predictable operator response to the resulting 401 storm — switching the
verifier to empty-secret pass-through — silently removes the
GHSA-3g33-6vg6-27m8 control entirely.

An in-cluster action has no such problem: it creates the Secret only if absent,
so it is idempotent under any renderer and any number of repeated syncs.

`kubectl create --dry-run=client -o yaml | kubectl apply` would overwrite; this
uses `create` and tolerates AlreadyExists, which is what makes it a no-op on
every run after the first.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fission-internal-auth-generator
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
    helm.sh/hook-weight: "-12"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fission-internal-auth-generator
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
    helm.sh/hook-weight: "-12"
rules:
# create only, and only in the release namespace: the Job never needs to read
# an existing master, so it cannot exfiltrate one. AlreadyExists on create is
# the signal that a value is present, which is all the idempotency needs.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fission-internal-auth-generator
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: hook-succeeded,hook-failed,before-hook-creation
    helm.sh/hook-weight: "-11"
subjects:
  - kind: ServiceAccount
    name: fission-internal-auth-generator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: fission-internal-auth-generator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ template "fullname" . }}-auth-gen-{{ .Chart.Version }}
  labels:
    release: "{{ .Release.Name }}"
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app: {{ template "name" . }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: hook-succeeded
    helm.sh/hook-weight: "-10"
spec:
  backoffLimit: 2
  template:
    metadata:
      name: {{ template "fullname" . }}-auth-gen
      labels:
        release: "{{ .Release.Name }}"
        app: {{ template "name" . }}
    spec:
      restartPolicy: Never
      serviceAccountName: fission-internal-auth-generator
      containers:
      - name: generate
        image: {{ include "preUpgradeChecksImage" . | quote }}
        imagePullPolicy: {{ .Values.pullPolicy }}
        command: ["/pre-upgrade-checks", "generate-internal-auth"]
        env:
        - name: INTERNAL_AUTH_SECRET_NAME
          value: {{ include "fission.internalAuthSecretName" . | quote }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.terminationMessagePath }}
        terminationMessagePath: {{ .Values.terminationMessagePath }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
