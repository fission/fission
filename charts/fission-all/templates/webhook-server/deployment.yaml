apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  labels:
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    svc: webhook-service
    application: fission-webhook
spec:
  replicas: {{ .Values.webhook.replicas | default 1 }}
  {{- with .Values.webhook.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      svc: webhook-service
      application: fission-webhook
  template:
    metadata:
      labels:
        svc: webhook-service
        application: fission-webhook
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      {{- if .Values.webhook.securityContext.enabled }}
      securityContext: {{- omit .Values.webhook.securityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      containers:
      - name: webhook
        image: {{ include "fission-bundleImage" . | quote }}
        imagePullPolicy: {{ .Values.pullPolicy }}
        command: ["/fission-bundle"]
        args: ["--webhookPort", "9443"]
        {{- if .Values.coverage.enabled }}
        env:
        {{- include "coverage.envs" . | indent 8 }}
        {{- end }}
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: serving-certs
          readOnly: true
        {{- include "coverage.volumemount" . | indent 8 }}
        ports:
          - containerPort: 8080
            name: metrics
        # maxUnavailable: 0 is only meaningful with a readiness signal: without
        # this the kubelet marks the pod Ready the instant the process starts,
        # so a surge pod joins the Service before controller-runtime has bound
        # the serving port — and every Fission CR write is fail-closed against
        # it (RFC-0028 §2).
        readinessProbe:
          tcpSocket:
            port: 9443
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 15
        resources:
          {{- toYaml .Values.webhook.resources | nindent 10 }}
      volumes:
      - name: serving-certs
        secret:
          secretName: fission-webhook-certs
      {{- include "coverage.volume" . | indent 6 }}
      serviceAccountName: fission-webhook
{{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
{{- end }}
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets: 
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- if .Values.extraCoreComponentPodConfig }}
{{ toYaml .Values.extraCoreComponentPodConfig | indent 6 -}}
{{- end }}