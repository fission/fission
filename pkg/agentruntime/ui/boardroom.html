<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fission Boardroom</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --card: #182130;
    --border: #26313f;
    --text: #d7e0ea;
    --muted: #7c8a9c;
    --active: #3ddc84;
    --idle: #f2b705;
    --archived: #5a6472;
    --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .stats { display: flex; gap: 20px; margin-left: auto; }
  .stat { text-align: center; }
  .stat span { display: block; font-size: 20px; font-weight: 700; }
  .stat label { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  #conn-status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #boardroom-main {
    position: relative;
    display: flex;
    gap: 0;
    height: calc(100vh - 57px);
  }
  section { flex: 1 1 50%; min-width: 0; overflow-y: auto; padding: 16px; }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  #pool-panel { border-left: 1px solid var(--border); }
  #pool-note { color: var(--muted); font-style: italic; }
  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--archived);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .card-id { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .card-agent { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card-badges { margin-top: 6px; display: flex; gap: 6px; }
  .badge {
    font-size: 10px;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--muted);
    margin-left: auto;
  }
  .badge.status-active { color: var(--active); border-color: var(--active); }
  .badge.status-idle { color: var(--idle); border-color: var(--idle); }
  .badge.status-archived { color: var(--archived); border-color: var(--archived); }
  .badge.served { color: var(--active); border-color: var(--active); margin-left: 0; }
  .badge.warm { color: var(--muted); margin-left: 0; }
  .badge.provisioned { color: var(--accent); border-color: var(--accent); }
  .badge.ready { color: var(--active); border-color: var(--active); margin-left: auto; }
  .teleport { color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  #anchor-svg { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
</style>
</head>
<body>
<div id="boardroom">
  <header>
    <h1>Fission Boardroom</h1>
    <div class="stats">
      <div class="stat"><span id="stat-sessions">0</span><label>sessions</label></div>
      <div class="stat"><span id="stat-pods">0</span><label>pods</label></div>
      <div class="stat"><span id="stat-density">&mdash;</span><label>density</label></div>
      <div class="stat"><span id="stat-teleports">0</span><label>teleports</label></div>
    </div>
    <div id="conn-status">connecting&hellip;</div>
  </header>
  <div id="boardroom-main">
    <section id="sessions-panel">
      <h2>Sessions</h2>
      <div id="sessions-list" class="card-list"></div>
    </section>
    <svg id="anchor-svg"></svg>
    <section id="pool-panel">
      <h2>Pool</h2>
      <div id="pool-note"></div>
      <div id="pool-list" class="card-list"></div>
    </section>
  </div>
</div>
<script>
"use strict";

// STATUS_COLOR keys match SessionRecord.Status ("active"/"idle"/"archived")
// from pkg/agentruntime/session.go.
var STATUS_COLOR = { active: "#3ddc84", idle: "#f2b705", archived: "#5a6472" };
var STATUS_ORDER = { active: 0, idle: 1, archived: 2 };

// TOKEN is read once from the page's URL fragment (#token=...), never the
// query string: a fragment is never sent to the server or logged by a
// fronting proxy, unlike EventsHandler's own ?token= transport (which exists
// only because a browser EventSource cannot set request headers -- see
// events.go's SECURITY note). Every other call here is a plain fetch(), so
// it carries the token as a normal Authorization header instead.
var TOKEN = (function () {
  var m = location.hash.match(/token=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
})();

function authHeaders() {
  return TOKEN ? { Authorization: "Bearer " + TOKEN } : {};
}

function sseURL() {
  return "/registry/events" + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function qs(sel) { return document.querySelector(sel); }

// sessions maps "namespace/agent/id" -> {record, teleports}. teleports is a
// client-side-only counter of CurrentPod CHANGES seen for that session (not
// its first assignment) -- the demo's "teleport" story.
var sessions = new Map();
var agents = [];
var pods = [];
var poolAvailable = false;

function sessionKey(r) { return r.namespace + "/" + r.agent + "/" + r.id; }
function cardId(r) { return "sess-" + sessionKey(r).replace(/[^a-zA-Z0-9]/g, "_"); }
function podCardId(p) { return "pod-" + (p.namespace + "_" + p.name).replace(/[^a-zA-Z0-9]/g, "_"); }

function upsertSession(rec) {
  var key = sessionKey(rec);
  var prev = sessions.get(key);
  var teleports = prev ? prev.teleports : 0;
  if (prev && prev.record.currentPod && rec.currentPod && prev.record.currentPod !== rec.currentPod) {
    teleports++;
  }
  sessions.set(key, { record: rec, teleports: teleports });
}

// matchPod finds the pool pod serving a session's CurrentPod, which is a
// "host:port" address (endpointcache.Endpoint.Address) -- PodSummary only
// carries the pod IP, so the join is on the address's host part.
function matchPod(currentPod) {
  var ip = currentPod.split(":")[0];
  for (var i = 0; i < pods.length; i++) {
    if (pods[i].ip === ip) return pods[i];
  }
  return null;
}

var renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(function () { renderQueued = false; render(); });
}

function render() {
  renderStats();
  renderSessions();
  renderPool();
  requestAnimationFrame(drawAnchors);
}

function renderStats() {
  var sessionCount = sessions.size;
  var podCount = pods.length;
  qs("#stat-sessions").textContent = sessionCount;
  qs("#stat-pods").textContent = podCount;
  qs("#stat-density").textContent = podCount > 0 ? (sessionCount / podCount).toFixed(1) + "x" : "—";
  var teleports = 0;
  sessions.forEach(function (e) { teleports += e.teleports; });
  qs("#stat-teleports").textContent = teleports;
}

function emptyState(msg) { return '<div class="empty">' + esc(msg) + "</div>"; }

function sessionCardHTML(entry) {
  var r = entry.record;
  var color = STATUS_COLOR[r.status] || STATUS_COLOR.archived;
  var shortId = r.id.slice(0, 8);
  var meta = "turns " + (r.stats.turns || 0) + " · continuations " + (r.stats.continuations || 0);
  if (entry.teleports > 0) {
    meta += ' · <span class="teleport">teleports ' + entry.teleports + "</span>";
  }
  return '<div class="card" id="' + cardId(r) + '" style="border-left-color:' + color + '">' +
    '<div class="card-top"><span class="dot" style="background:' + color + '"></span>' +
    '<span class="card-id">' + esc(shortId) + "</span>" +
    '<span class="badge status-' + esc(r.status) + '">' + esc(r.status) + "</span></div>" +
    '<div class="card-agent">' + esc(r.namespace) + "/" + esc(r.agent) + "</div>" +
    '<div class="card-meta">' + meta + "</div></div>";
}

function renderSessions() {
  var items = Array.from(sessions.values()).sort(function (a, b) {
    var oa = STATUS_ORDER[a.record.status], ob = STATUS_ORDER[b.record.status];
    if (oa !== ob) return oa - ob;
    return (b.record.lastActiveAt || "").localeCompare(a.record.lastActiveAt || "");
  });
  qs("#sessions-list").innerHTML = items.map(sessionCardHTML).join("") || emptyState("no sessions yet");
}

function podCardHTML(p) {
  var badges = p.served
    ? '<span class="badge served">served</span>'
    : '<span class="badge warm">warm</span>';
  if (p.provisioned) badges += '<span class="badge provisioned">provisioned</span>';
  var ready = p.ready ? '<span class="badge ready">ready</span>' : "";
  return '<div class="card" id="' + podCardId(p) + '">' +
    '<div class="card-top"><span class="card-id">' + esc(p.name) + "</span>" + ready + "</div>" +
    '<div class="card-meta">' + esc(p.environment || "—") + " · " + esc(p.ip || "no ip") + "</div>" +
    '<div class="card-badges">' + badges + "</div></div>";
}

function renderPool() {
  var note = qs("#pool-note");
  if (!poolAvailable) {
    note.textContent = "pool unavailable";
    qs("#pool-list").innerHTML = "";
    return;
  }
  note.textContent = "";
  var sorted = pods.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  qs("#pool-list").innerHTML = sorted.map(podCardHTML).join("") || emptyState("no pods");
}

// drawAnchors draws one SVG line per active session whose CurrentPod
// resolves to a pool pod: the "boardroom" visual (session card <-> pod,
// color-matched).
function drawAnchors() {
  var svg = qs("#anchor-svg");
  var container = qs("#boardroom-main");
  var rect = container.getBoundingClientRect();
  svg.setAttribute("width", rect.width);
  svg.setAttribute("height", rect.height);
  svg.innerHTML = "";
  sessions.forEach(function (entry) {
    var r = entry.record;
    if (r.status !== "active" || !r.currentPod) return;
    var pod = matchPod(r.currentPod);
    if (!pod) return;
    var sEl = document.getElementById(cardId(r));
    var pEl = document.getElementById(podCardId(pod));
    if (!sEl || !pEl) return;
    var sr = sEl.getBoundingClientRect();
    var pr = pEl.getBoundingClientRect();
    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", sr.right - rect.left);
    line.setAttribute("y1", sr.top + sr.height / 2 - rect.top);
    line.setAttribute("x2", pr.left - rect.left);
    line.setAttribute("y2", pr.top + pr.height / 2 - rect.top);
    line.setAttribute("stroke", STATUS_COLOR.active);
    line.setAttribute("stroke-width", "1.5");
    line.setAttribute("opacity", "0.55");
    svg.appendChild(line);
  });
}

function setConnStatus(text) { qs("#conn-status").textContent = text; }

async function apiGet(path) {
  return fetch(path, { headers: authHeaders() });
}

async function loadAgents() {
  try {
    var res = await apiGet("/registry/agents");
    if (res.ok) {
      var data = await res.json();
      agents = data.agents || [];
    }
  } catch (e) { /* keep the previous list; next tick retries */ }
}

async function loadPool() {
  try {
    var res = await apiGet("/registry/pool");
    if (res.status === 503) {
      poolAvailable = false;
      pods = [];
    } else if (res.ok) {
      var data = await res.json();
      poolAvailable = true;
      pods = data.pods || [];
    }
  } catch (e) {
    poolAvailable = false;
    pods = [];
  }
  scheduleRender();
}

// pollSessionsTick is the SSE-unavailable fallback: it re-lists every known
// agent's sessions and treats each agent's page as ground truth, dropping
// any previously-seen session for that agent that no longer appears (the
// SSE feed never sends deletions either -- see events.go's package doc --
// so this is the same reconciliation the feed's own fallback advice
// prescribes). limit=500 (maxSessionListLimit) covers the demo's session
// counts in one page; a production poller would walk `next`.
async function pollSessionsTick() {
  await loadAgents();
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    try {
      var path = "/registry/agents/" + encodeURIComponent(a.namespace) + "/" +
        encodeURIComponent(a.name) + "/sessions?limit=500";
      var res = await apiGet(path);
      if (!res.ok) continue;
      var data = await res.json();
      var seen = new Set();
      (data.sessions || []).forEach(function (rec) {
        upsertSession(rec);
        seen.add(sessionKey(rec));
      });
      sessions.forEach(function (entry, key) {
        if (entry.record.namespace === a.namespace && entry.record.agent === a.name && !seen.has(key)) {
          sessions.delete(key);
        }
      });
    } catch (e) { /* leave this agent's sessions stale for one tick */ }
  }
  scheduleRender();
}

var pollTimer = null;
function startPolling() {
  if (pollTimer) return;
  pollSessionsTick();
  pollTimer = setInterval(pollSessionsTick, 5000);
}

function connectSSE() {
  var es = new EventSource(sseURL());
  es.addEventListener("session", function (ev) {
    try {
      var msg = JSON.parse(ev.data);
      upsertSession(msg.record);
      scheduleRender();
    } catch (e) { /* malformed frame: next diff or poll heals it */ }
  });
  es.addEventListener("agents", function () { loadAgents(); });
  es.onopen = function () { setConnStatus("live (SSE)"); };
  es.onerror = function () {
    es.close();
    setConnStatus("polling (SSE unavailable)");
    startPolling();
  };
}

async function init() {
  await loadAgents();
  await loadPool();
  setInterval(loadPool, 5000); // pool topology has no SSE event; always polled
  connectSSE();
  render();
}

window.addEventListener("resize", function () { requestAnimationFrame(drawAnchors); });

init();
</script>
</body>
</html>
