<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fission Boardroom</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121821;
    --card: #182130;
    --border: #26313f;
    --text: #d7e0ea;
    --muted: #7c8a9c;
    --active: #3ddc84;
    --idle: #f2b705;
    --archived: #5a6472;
    --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .stats { display: flex; gap: 20px; margin-left: auto; }
  .stat { text-align: center; }
  .stat span { display: block; font-size: 20px; font-weight: 700; }
  .stat label { font-size: 10px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
  #conn-status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  #boardroom-main {
    position: relative;
    display: flex;
    gap: 0;
    height: calc(100vh - 57px);
  }
  section { flex: 1 1 50%; min-width: 0; overflow-y: auto; padding: 16px; }
  section h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  #pool-panel { border-left: 1px solid var(--border); }
  #pool-note { color: var(--muted); font-style: italic; }
  .card-list { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--archived);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .card-top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .card-id { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .card-agent { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card-badges { margin-top: 6px; display: flex; gap: 6px; }
  .badge {
    font-size: 10px;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--muted);
    margin-left: auto;
  }
  .badge.status-active { color: var(--active); border-color: var(--active); }
  .badge.status-idle { color: var(--idle); border-color: var(--idle); }
  .badge.status-archived { color: var(--archived); border-color: var(--archived); }
  .badge.served { color: var(--active); border-color: var(--active); margin-left: 0; }
  .badge.warm { color: var(--muted); margin-left: 0; }
  .badge.provisioned { color: var(--accent); border-color: var(--accent); }
  .badge.ready { color: var(--active); border-color: var(--active); margin-left: auto; }
  .teleport { color: var(--accent); }
  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }
  #anchor-svg { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 5; }
  .card[data-key] { cursor: pointer; }
  .card[data-key]:hover { border-color: var(--accent); }

  /* Session transcript detail panel (Task 6): a right-hand overlay opened by
     clicking a session card, closed on Escape or an outside click. Lives
     OUTSIDE #sessions-list on purpose -- that list's innerHTML is replaced
     wholesale on every SSE event / 5s poll tick, which would otherwise blow
     away an open panel mid-view. */
  #detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4, 7, 11, 0.55);
    z-index: 50;
    display: flex;
    justify-content: flex-end;
  }
  #detail-overlay[hidden] { display: none; }
  #detail-panel {
    width: min(480px, 92vw);
    height: 100%;
    background: var(--panel);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
  }
  #detail-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  #detail-title { font-family: ui-monospace, Menlo, monospace; font-size: 13px; word-break: break-all; }
  #detail-close {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    width: 26px;
    height: 26px;
    line-height: 1;
    font-size: 16px;
    cursor: pointer;
    flex: none;
  }
  #detail-close:hover { border-color: var(--accent); color: var(--accent); }
  #detail-body { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px; }
  .ckpt-marker {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--accent);
    border-top: 1px dashed var(--accent);
    border-bottom: 1px dashed var(--accent);
    padding: 6px 0;
    margin-bottom: 8px;
  }
  .ckpt-payload {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    margin: 0 0 16px;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .turn-group { margin-bottom: 14px; }
  .turn-group h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .event-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    margin-bottom: 6px;
  }
  .event-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .event-type { color: var(--text); font-weight: 600; }
  .event-payload {
    margin: 0;
    font-size: 11px;
    font-family: ui-monospace, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .detail-head-line { color: var(--muted); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<div id="boardroom">
  <header>
    <h1>Fission Boardroom</h1>
    <div class="stats">
      <div class="stat"><span id="stat-sessions">0</span><label>sessions</label></div>
      <div class="stat"><span id="stat-pods">0</span><label>pods</label></div>
      <div class="stat"><span id="stat-density">&mdash;</span><label>density</label></div>
      <div class="stat"><span id="stat-teleports">0</span><label>teleports</label></div>
    </div>
    <div id="conn-status">connecting&hellip;</div>
  </header>
  <div id="boardroom-main">
    <section id="sessions-panel">
      <h2>Sessions</h2>
      <div id="sessions-list" class="card-list"></div>
    </section>
    <svg id="anchor-svg"></svg>
    <section id="pool-panel">
      <h2>Pool</h2>
      <div id="pool-note"></div>
      <div id="pool-list" class="card-list"></div>
    </section>
  </div>
</div>
<div id="detail-overlay" hidden>
  <div id="detail-panel" role="dialog" aria-modal="true" aria-label="Session transcript">
    <div id="detail-header">
      <div id="detail-title"></div>
      <button id="detail-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div id="detail-body"></div>
  </div>
</div>
<script>
"use strict";

// STATUS_COLOR keys match SessionRecord.Status ("active"/"idle"/"archived")
// from pkg/agentruntime/session.go.
var STATUS_COLOR = { active: "#3ddc84", idle: "#f2b705", archived: "#5a6472" };
var STATUS_ORDER = { active: 0, idle: 1, archived: 2 };

// TOKEN is read once from the page's URL fragment (#token=...), never the
// query string: a fragment is never sent to the server or logged by a
// fronting proxy, unlike EventsHandler's own ?token= transport (which exists
// only because a browser EventSource cannot set request headers -- see
// events.go's SECURITY note). Every other call here is a plain fetch(), so
// it carries the token as a normal Authorization header instead.
var TOKEN = (function () {
  var m = location.hash.match(/token=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : "";
})();

function authHeaders() {
  return TOKEN ? { Authorization: "Bearer " + TOKEN } : {};
}

function sseURL() {
  return "/registry/events" + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : "");
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function qs(sel) { return document.querySelector(sel); }

// sessions maps "namespace/agent/id" -> {record, teleports}. teleports is a
// client-side-only counter of CurrentPod CHANGES seen for that session (not
// its first assignment) -- the demo's "teleport" story.
var sessions = new Map();
var agents = [];
var pods = [];
var poolAvailable = false;

function sessionKey(r) { return r.namespace + "/" + r.agent + "/" + r.id; }
function cardId(r) { return "sess-" + sessionKey(r).replace(/[^a-zA-Z0-9]/g, "_"); }
function podCardId(p) { return "pod-" + (p.namespace + "_" + p.name).replace(/[^a-zA-Z0-9]/g, "_"); }

function upsertSession(rec) {
  var key = sessionKey(rec);
  var prev = sessions.get(key);
  var teleports = prev ? prev.teleports : 0;
  if (prev && prev.record.currentPod && rec.currentPod && prev.record.currentPod !== rec.currentPod) {
    teleports++;
  }
  sessions.set(key, { record: rec, teleports: teleports });
}

// matchPod finds the pool pod serving a session's CurrentPod, which is a
// "host:port" address (endpointcache.Endpoint.Address) -- PodSummary only
// carries the pod IP, so the join is on the address's host part.
function matchPod(currentPod) {
  var ip = currentPod.split(":")[0];
  for (var i = 0; i < pods.length; i++) {
    if (pods[i].ip === ip) return pods[i];
  }
  return null;
}

var renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(function () { renderQueued = false; render(); });
}

function render() {
  renderStats();
  renderSessions();
  renderPool();
  requestAnimationFrame(drawAnchors);
}

function renderStats() {
  var sessionCount = sessions.size;
  var podCount = pods.length;
  qs("#stat-sessions").textContent = sessionCount;
  qs("#stat-pods").textContent = podCount;
  qs("#stat-density").textContent = podCount > 0 ? (sessionCount / podCount).toFixed(1) + "x" : "—";
  var teleports = 0;
  sessions.forEach(function (e) { teleports += e.teleports; });
  qs("#stat-teleports").textContent = teleports;
}

function emptyState(msg) { return '<div class="empty">' + esc(msg) + "</div>"; }

function sessionCardHTML(entry) {
  var r = entry.record;
  var color = STATUS_COLOR[r.status] || STATUS_COLOR.archived;
  var shortId = r.id.slice(0, 8);
  var meta = "turns " + (r.stats.turns || 0) + " · continuations " + (r.stats.continuations || 0);
  if (entry.teleports > 0) {
    meta += ' · <span class="teleport">teleports ' + entry.teleports + "</span>";
  }
  // data-key carries the exact sessions Map key (not the sanitized DOM id,
  // which is lossy) so the click handler below can look the record back up.
  return '<div class="card" id="' + cardId(r) + '" data-key="' + esc(sessionKey(r)) + '" style="border-left-color:' + color + '">' +
    '<div class="card-top"><span class="dot" style="background:' + color + '"></span>' +
    '<span class="card-id">' + esc(shortId) + "</span>" +
    '<span class="badge status-' + esc(r.status) + '">' + esc(r.status) + "</span></div>" +
    '<div class="card-agent">' + esc(r.namespace) + "/" + esc(r.agent) + "</div>" +
    '<div class="card-meta">' + meta + "</div></div>";
}

function renderSessions() {
  var items = Array.from(sessions.values()).sort(function (a, b) {
    var oa = STATUS_ORDER[a.record.status], ob = STATUS_ORDER[b.record.status];
    if (oa !== ob) return oa - ob;
    return (b.record.lastActiveAt || "").localeCompare(a.record.lastActiveAt || "");
  });
  qs("#sessions-list").innerHTML = items.map(sessionCardHTML).join("") || emptyState("no sessions yet");
}

function podCardHTML(p) {
  var badges = p.served
    ? '<span class="badge served">served</span>'
    : '<span class="badge warm">warm</span>';
  if (p.provisioned) badges += '<span class="badge provisioned">provisioned</span>';
  var ready = p.ready ? '<span class="badge ready">ready</span>' : "";
  return '<div class="card" id="' + podCardId(p) + '">' +
    '<div class="card-top"><span class="card-id">' + esc(p.name) + "</span>" + ready + "</div>" +
    '<div class="card-meta">' + esc(p.environment || "—") + " · " + esc(p.ip || "no ip") + "</div>" +
    '<div class="card-badges">' + badges + "</div></div>";
}

function renderPool() {
  var note = qs("#pool-note");
  if (!poolAvailable) {
    note.textContent = "pool unavailable";
    qs("#pool-list").innerHTML = "";
    return;
  }
  note.textContent = "";
  var sorted = pods.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
  qs("#pool-list").innerHTML = sorted.map(podCardHTML).join("") || emptyState("no pods");
}

// drawAnchors draws one SVG line per active session whose CurrentPod
// resolves to a pool pod: the "boardroom" visual (session card <-> pod,
// color-matched).
function drawAnchors() {
  var svg = qs("#anchor-svg");
  var container = qs("#boardroom-main");
  var rect = container.getBoundingClientRect();
  svg.setAttribute("width", rect.width);
  svg.setAttribute("height", rect.height);
  svg.innerHTML = "";
  sessions.forEach(function (entry) {
    var r = entry.record;
    if (r.status !== "active" || !r.currentPod) return;
    var pod = matchPod(r.currentPod);
    if (!pod) return;
    var sEl = document.getElementById(cardId(r));
    var pEl = document.getElementById(podCardId(pod));
    if (!sEl || !pEl) return;
    var sr = sEl.getBoundingClientRect();
    var pr = pEl.getBoundingClientRect();
    var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", sr.right - rect.left);
    line.setAttribute("y1", sr.top + sr.height / 2 - rect.top);
    line.setAttribute("x2", pr.left - rect.left);
    line.setAttribute("y2", pr.top + pr.height / 2 - rect.top);
    line.setAttribute("stroke", STATUS_COLOR.active);
    line.setAttribute("stroke-width", "1.5");
    line.setAttribute("opacity", "0.55");
    svg.appendChild(line);
  });
}

function setConnStatus(text) { qs("#conn-status").textContent = text; }

async function apiGet(path) {
  return fetch(path, { headers: authHeaders() });
}

async function loadAgents() {
  try {
    var res = await apiGet("/registry/agents");
    if (res.ok) {
      var data = await res.json();
      agents = data.agents || [];
    }
  } catch (e) { /* keep the previous list; next tick retries */ }
}

async function loadPool() {
  try {
    var res = await apiGet("/registry/pool");
    if (res.status === 503) {
      poolAvailable = false;
      pods = [];
    } else if (res.ok) {
      var data = await res.json();
      poolAvailable = true;
      pods = data.pods || [];
    }
  } catch (e) {
    poolAvailable = false;
    pods = [];
  }
  scheduleRender();
}

// pollSessionsTick is the SSE-unavailable fallback: it re-lists every known
// agent's sessions and treats each agent's page as ground truth, dropping
// any previously-seen session for that agent that no longer appears (the
// SSE feed never sends deletions either -- see events.go's package doc --
// so this is the same reconciliation the feed's own fallback advice
// prescribes). limit=500 (maxSessionListLimit) covers the demo's session
// counts in one page; a production poller would walk `next`.
async function pollSessionsTick() {
  await loadAgents();
  for (var i = 0; i < agents.length; i++) {
    var a = agents[i];
    try {
      var path = "/registry/agents/" + encodeURIComponent(a.namespace) + "/" +
        encodeURIComponent(a.name) + "/sessions?limit=500";
      var res = await apiGet(path);
      if (!res.ok) continue;
      var data = await res.json();
      var seen = new Set();
      (data.sessions || []).forEach(function (rec) {
        upsertSession(rec);
        seen.add(sessionKey(rec));
      });
      sessions.forEach(function (entry, key) {
        if (entry.record.namespace === a.namespace && entry.record.agent === a.name && !seen.has(key)) {
          sessions.delete(key);
        }
      });
    } catch (e) { /* leave this agent's sessions stale for one tick */ }
  }
  scheduleRender();
}

var pollTimer = null;
function startPolling() {
  if (pollTimer) return;
  pollSessionsTick();
  pollTimer = setInterval(pollSessionsTick, 5000);
}

function connectSSE() {
  var es = new EventSource(sseURL());
  es.addEventListener("session", function (ev) {
    try {
      var msg = JSON.parse(ev.data);
      upsertSession(msg.record);
      scheduleRender();
    } catch (e) { /* malformed frame: next diff or poll heals it */ }
  });
  es.addEventListener("agents", function () { loadAgents(); });
  es.onopen = function () { setConnStatus("live (SSE)"); };
  es.onerror = function () {
    es.close();
    setConnStatus("polling (SSE unavailable)");
    startPolling();
  };
}

// --- Session transcript detail panel (Task 6) -----------------------------
//
// Fetches Task 4's registry history/checkpoint endpoints for one session and
// renders them: events grouped by turn (base64-decoded, pretty-printed JSON)
// with the checkpoint shown as a leading "compacted through seq N" marker.
// Uses the SAME apiGet()/authHeaders() plumbing as every other registry call
// on this page -- no new auth path.

function detailOverlay() { return qs("#detail-overlay"); }
function detailBody() { return qs("#detail-body"); }
function detailTitleEl() { return qs("#detail-title"); }

// decodeEventPayload turns one history/checkpoint event's base64 `payload`
// field back into {ok, value, text}: value is the parsed JSON object when
// the bytes decode as JSON, text is always the raw decoded string (used as a
// fallback rendering, and to survive a payload that isn't JSON at all).
// atob() alone mangles non-ASCII payload bytes, so the base64 is expanded to
// a Uint8Array and decoded as UTF-8 explicitly.
function decodeEventPayload(b64) {
  try {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    var text = new TextDecoder().decode(bytes);
    try {
      return { ok: true, value: JSON.parse(text), text: text };
    } catch (e) {
      return { ok: true, value: null, text: text };
    }
  } catch (e) {
    return { ok: false, value: null, text: "" };
  }
}

// eventTurnOf extracts the {turn} tag this fixture writes into every history
// event payload (support-desk.js's {v,turn,step,kind,at} envelope). Events
// this page cannot parse a numeric turn out of land in a single -1 "other"
// bucket rather than being dropped, so a non-support-desk agent's history
// still renders.
function eventTurnOf(decoded) {
  if (decoded.ok && decoded.value && typeof decoded.value.turn === "number") {
    return decoded.value.turn;
  }
  return -1;
}

function prettyPayload(decoded) {
  if (decoded.ok && decoded.value !== null) {
    try { return JSON.stringify(decoded.value, null, 2); } catch (e) { /* fall through */ }
  }
  return decoded.text || "(unreadable payload)";
}

function eventRowHTML(ev) {
  var decoded = decodeEventPayload(ev.payload);
  return '<div class="event-row">' +
    '<div class="event-meta">seq ' + esc(ev.seq) + ' · <span class="event-type">' + esc(ev.type) +
    "</span> · " + esc(ev.at) + "</div>" +
    '<pre class="event-payload">' + esc(prettyPayload(decoded)) + "</pre></div>";
}

function renderDetailBody(history, checkpoint) {
  var events = (history && history.events) || [];
  var groups = new Map(); // turn number (or -1) -> events[]
  events.forEach(function (ev) {
    var t = eventTurnOf(decodeEventPayload(ev.payload));
    if (!groups.has(t)) groups.set(t, []);
    groups.get(t).push(ev);
  });
  var turns = Array.from(groups.keys()).sort(function (a, b) { return a - b; });

  var html = "";
  if (checkpoint) {
    html += '<div class="ckpt-marker">compacted through seq ' + esc(checkpoint.coveredThroughSeq) +
      " · checkpoint turn " + esc(checkpoint.turn) +
      " · " + esc(checkpoint.createdAt) + "</div>";
    var payloadText = "(no payload)";
    try { payloadText = JSON.stringify(checkpoint.payload, null, 2); } catch (e) { /* leave default */ }
    html += '<pre class="ckpt-payload">' + esc(payloadText) + "</pre>";
  }

  if (turns.length === 0) {
    html += emptyState("no history events for this session");
  } else {
    turns.forEach(function (t) {
      html += '<div class="turn-group"><h3>' + (t >= 0 ? "turn " + esc(t) : "other events") + "</h3>";
      html += groups.get(t).map(eventRowHTML).join("");
      html += "</div>";
    });
  }

  html += '<div class="detail-head-line">history head: seq ' + esc((history && history.head) || 0) + "</div>";
  detailBody().innerHTML = html;
}

// detailEpoch guards against a slow fetch from a PREVIOUS card overwriting a
// later click's content: clicking card A then quickly card B before A's
// fetches land must not paint A's transcript under B's title.
var detailEpoch = 0;

async function openSessionDetail(rec) {
  var myEpoch = ++detailEpoch;
  detailTitleEl().textContent = rec.namespace + "/" + rec.agent + " · " + rec.id;
  detailBody().innerHTML = emptyState("loading transcript…");
  detailOverlay().hidden = false;

  var base = "/registry/agents/" + encodeURIComponent(rec.namespace) + "/" +
    encodeURIComponent(rec.agent) + "/sessions/" + encodeURIComponent(rec.id);

  var history = { head: 0, events: [] };
  var checkpoint = null;
  try {
    var histRes = await apiGet(base + "/history?limit=200");
    if (histRes.ok) {
      history = await histRes.json();
      // The first page reads from fromSeq=0, so a head beyond the 200-event
      // page size lands the OLDEST 200 events, not the most recent -- refetch
      // the tail (the last 200 events up to head) so the panel shows what
      // just happened instead of ancient history.
      if (history.head > 200) {
        var tailRes = await apiGet(base + "/history?limit=200&fromSeq=" + (history.head - 200));
        if (tailRes.ok) history = await tailRes.json();
      }
    }
  } catch (e) { /* history stays empty; the panel still opens */ }
  try {
    var ckptRes = await apiGet(base + "/checkpoint");
    // 404 is the documented "no checkpoint yet" shape (also what a
    // history-disabled agent's session answers) -- not an error, just no
    // marker line.
    if (ckptRes.ok) checkpoint = await ckptRes.json();
  } catch (e) { /* checkpoint stays null */ }

  // The overlay may have been closed (Escape/outside-click), or another
  // card opened, while these two fetches were in flight; do not resurrect
  // stale content or paint over a newer selection.
  if (detailOverlay().hidden || myEpoch !== detailEpoch) return;
  renderDetailBody(history, checkpoint);
}

function closeSessionDetail() {
  detailOverlay().hidden = true;
  detailBody().innerHTML = "";
}

// Delegated listener: #sessions-list's innerHTML is replaced wholesale on
// every render(), so a per-card handler would be lost on the next tick.
qs("#sessions-list").addEventListener("click", function (ev) {
  var card = ev.target.closest(".card");
  if (!card) return;
  var key = card.getAttribute("data-key");
  var entry = key && sessions.get(key);
  if (!entry) return;
  openSessionDetail(entry.record);
});

qs("#detail-close").addEventListener("click", closeSessionDetail);
detailOverlay().addEventListener("click", function (ev) {
  if (ev.target === detailOverlay()) closeSessionDetail(); // outside click
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && !detailOverlay().hidden) closeSessionDetail();
});

async function init() {
  await loadAgents();
  await loadPool();
  setInterval(loadPool, 5000); // pool topology has no SSE event; always polled
  connectSSE();
  render();
}

window.addEventListener("resize", function () { requestAnimationFrame(drawAnchors); });

init();
</script>
</body>
</html>
